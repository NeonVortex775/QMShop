# ═══════════════════════════════════════════════════════════════════
#  青冥商城 · 自定义界面（语法与龙核 DragonCore 的 Gui 完全一致）
#  ───────────────────────────────────────────────────────────────────
#  这个文件放在 plugins/QingMingShop/gui/ 下，改完 /shop reload 生效。
#
#  match: 匹配哪个商店。填 shops/ 下的文件名（不带 .yml），
#         或者填 "*" 表示所有商店通用。
#         有同名商店时优先用 match 等于商店名的那个模板。
#
#  size:  [宽, 高] —— 不写就用商店 layout 里的尺寸
#  rows:  这个界面画了几行商品 —— 不写就用商店 layout.rows
#
#  ── 插件认的组件名（名字必须以这些开头，插件才知道往哪填数据）──
#  行1名 ~ 行4名        label，自动填商品名
#  行1价 ~ 行4价        label，自动填这一行的「需要 xxx」
#  行1图标 ~ 行4图标     slot，自动塞商品图标
#  行1需求1 ~ 行1需求4   slot，自动塞第 1~4 项需求的图标
#  行1选择字             label，选中时显示「已选」，否则「选择」
#  面板xxx              没选中商品时整组隐藏
#  面板数量 / 面板合计   自动填当前数量和「数量 × 商品 合计」
#  提示xxx              没选中时显示
#  标题 / 页码 / 上一页 / 下一页
#
#  ── 关于坐标（重要）──
#  所有组件的 x 都写成  (w-760)/2+数字，y 写成 (h-414)/2+数字。
#  w / h 是屏幕（GUI 缩放后）的宽高，减掉界面尺寸再除以 2 = 居中。
#  所以这个界面在任何分辨率下都居中显示，不会贴在屏幕左上角。
#  想整体挪动：只改 (w-760) / (h-414) 这两个数字，别去动后面的偏移量。
#  想加组件：照抄一行，x 写 (w-760)/2+新x，y 写 (h-414)/2+新y。
#
#  ── 可用变量（写在任何字符串里都会被替换）──
#  {w} {h} {shop} {title} {page} {pages} {qty} {rows} {step} {big}
#  行组件里另可用 {index}（商品下标）和 {row}（行号）
#
#  ── 按钮怎么调插件 ──
#  方法.发包('QingMingShop', '动作', '参数')
#    select {index}     选中第几个商品
#    qty 1 / qty -1     数量增减（可配合 {step} {big}）
#    qty set 8          直接设成 8
#    page 1 / page -1   翻页
#    buy / cancel       购买 / 取消选择
#    open <商店ID>      切换商店
#    close              关闭
#  可以写成：方法.发包('QingMingShop', 'qty', '-{step}')
# ═══════════════════════════════════════════════════════════════════

